name: hotel-scan

# 同一时间只跑一轮：多轮并发推结果回 main 会抢推送、丢结果
concurrency:
  group: hotel-scan
  cancel-in-progress: false

# 2026-11-26 用户叫停：定时与推送触发已全部去掉，只剩手动触发（workflow_dispatch），
# 需要时可在 Actions 里手动跑，平时不会自动跑。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        # 只要 requests：scan.py 只做 HTTP，不用 ffmpeg。ffmpeg 是给 frames.py
        # 抽帧用的，用户已说不用验帧；apt-get 装 ffmpeg 曾卡住整轮（run 45786579992）。
        run: pip install -q requests

      - name: Scan for Jade
        working-directory: hotel-scan
        run: python3 scan.py

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: jade-candidates
          path: hotel-scan/results/
          if-no-files-found: warn

      - name: Commit results back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hotel-scan/results/candidates.json hotel-scan/results/scan_stats.json hotel-scan/ip-library.json || true
          git diff --cached --quiet && echo "no results to commit" || { git commit -m "hotel-scan results $(date -u +%Y-%m-%dT%H:%M:%SZ)"; git pull --rebase || true; git push || echo "push raced with another run, results kept in artifact"; }
