name: hotel-scan

# 同一时间只跑一轮：多轮并发推结果回 main 会抢推送、丢结果
concurrency:
  group: hotel-scan
  cancel-in-progress: false

on:
  push:
    paths:
      - 'hotel-scan/scan.py'
      - 'hotel-scan/seeds.txt'
      - 'hotel-scan/frames.py'
      - '.github/workflows/hotel-scan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg and requests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q requests

      - name: Scan for Jade
        working-directory: hotel-scan
        run: python3 scan.py

      - name: Extract frames for candidates
        working-directory: hotel-scan
        run: python3 frames.py

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: jade-candidates
          path: hotel-scan/results/
          if-no-files-found: warn

      - name: Commit results back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hotel-scan/results/candidates.json hotel-scan/results/scan_stats.json hotel-scan/results/frames || true
          git diff --cached --quiet && echo "no results to commit" || { git commit -m "hotel-scan results $(date -u +%Y-%m-%dT%H:%M:%SZ)"; git pull --rebase || true; git push || echo "push raced with another run, results kept in artifact"; }
