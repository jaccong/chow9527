# test.py 试跑：把 jaccong/6018 的 test.py 原样搬过来，在 Actions 里跑一轮，
# 看结果跟 hotel-scan/scan.py 是不是一样。
# test.py 本身一个字没改（md5 e3f804cbdfd05ae87509e4e5b09e2584），只包了一层 workflow。
name: test-py-trial

on:
  push:
    paths:
      - 'hotel-scan/test.py'
      - '.github/workflows/test-run.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-test-py:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install selenium eventlet requests
      - name: Run test.py
        working-directory: hotel-scan
        run: python test.py
      - name: Upload test.txt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-py-result
          path: hotel-scan/test.txt
          if-no-files-found: warn
      - name: Commit test.txt back
        if: always()
        run: |
          mkdir -p hotel-scan/results
          cp -f hotel-scan/test.txt hotel-scan/results/test.txt 2>/dev/null || true
          git config user.name "muse-bot"
          git config user.email "muse-bot@users.noreply.github.com"
          git add hotel-scan/results/test.txt || true
          git diff --cached --quiet || git commit -m "test.py trial result [skip ci]"
          git push || true
